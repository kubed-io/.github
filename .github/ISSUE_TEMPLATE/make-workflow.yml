name: 🔧 Make an n8n workflow
description: Describe an n8n workflow for the plan agent to plan and GitHub Copilot to build.
title: "[workflow]: "
labels: ["agent"]
body:
- type: markdown
  attributes:
    value: |
      This issue feeds the **issue → plan → build** loop for n8n workflows. Fill in the
      request below — it becomes the prompt the agents work from, so be concrete. On submit,
      the 🧭 **Plan Agent** inspects the live n8n instance (read-only, via the n8n MCP) and
      the repo, then appends a plan to this issue; refine it by commenting `@claude …`. When
      the plan looks right, assign **Copilot** to build the workflow and open a PR.
- type: textarea
  id: workflow
  attributes:
    label: What should the workflow do?
    description: The trigger, the steps, and the outcome. Name the source/destination systems and any transforms.
    placeholder: e.g. On a webhook POST, look up the customer in Postgres, then post a summary to the #ops Slack channel; retry the Slack call twice on failure.
  validations:
    required: true
- type: input
  id: instance
  attributes:
    label: Target n8n instance / environment
    description: Which n8n instance or environment this workflow targets (leave blank for the default in-cluster instance).
    placeholder: e.g. in-cluster n8n (flow namespace) / staging / production
  validations:
    required: false
- type: textarea
  id: acceptance
  attributes:
    label: Acceptance criteria
    description: What does "done" look like? A checklist the builder (and reviewer) can verify against.
    placeholder: |
      - [ ] Workflow validates cleanly (n8n_validate_workflow)
      - [ ] A test run of ... produces ...
      - [ ] ...
  validations:
    required: true
- type: markdown
  attributes:
    value: |
      ---
      _The plan agent maintains everything below the divider it adds — edit your request above
      it, or comment `@claude` to refine. Don't hand-edit the generated plan._
